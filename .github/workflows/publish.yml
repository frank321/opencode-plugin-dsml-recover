name: Publish

# Publishes to npm when a version tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# Requires a repository secret `NPM_TOKEN` (an npm automation/granular token with publish rights).
#
# Manual publishing is still fine; this is the "tag and go" path.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck + tests
        run: bun run check

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
